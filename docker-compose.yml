# revU - local stack: PostgreSQL 18, MinIO (stand-in for Cloudflare R2), Gotenberg (PDF), the API.
# The app itself runs with `npm run dev` in frontend/ and proxies /api to the API.

services:
  api:
    build: ./backend
    ports: ['8080:8080']
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://revu:secret@db:5432/revu?sslmode=disable"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
      APP_VERSION: "dev"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: revu
      POSTGRES_USER: revu
      POSTGRES_PASSWORD: secret
    volumes:
      # Postgres 18 keeps its data one level down from earlier versions.
      - postgres_data:/var/lib/postgresql
      # Applied in name order on the first start of an empty volume.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports: ['5432:5432']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revu -d revu"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: revu
      MINIO_ROOT_PASSWORD: revu-secret
    ports: ['9000:9000', '9001:9001']
    volumes:
      - minio_data:/data

  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ['3001:3000']

volumes:
  postgres_data:
  minio_data:
