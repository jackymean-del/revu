<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>revU</title>
    <meta name="description" content="revU - review staff and students in one place. Appraisals, observations, exams, marks and progress reports.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23685DBC'/%3E%3Cg transform='translate(6 6)'%3E%3Cpath d='M16 9 L16 30 A10 10 0 0 0 36 30 L36 22' fill='none' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='36' cy='12.5' r='5' fill='%23D4920E'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F3FF; --card: #ffffff; --sunken: #F8F7FF; --line: #ECEAFB; --line-2: #C9C3EC;
            --ink: #13111E; --muted: #4B5275; --subtle: #6B7079; --head: #777489;
            --brand: #685DBC; --brand-strong: #4B41C4; --mist: #EDE9FF; --gold: #D4920E;
            --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
        }
        body.dark {
            --bg: #0F0E17; --card: #1B1926; --sunken: #13111E; --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.18);
            --ink: #EEEDF7; --muted: #B9B6CF; --subtle: #8C88A6; --head: #8C88A6;
            --brand: #9B8EF5; --brand-strong: #C4B5FD; --mist: rgba(155,142,245,0.16);
            --ok: #4ade80; --ok-soft: rgba(74,222,128,0.12); --warn: #fbbf24; --warn-soft: rgba(251,191,36,0.14);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid rgba(124,111,224,.65); outline-offset: 2px; border-radius: 6px; }

        /* top bar */
        .top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--card); border-bottom: 1px solid var(--line); }
        .lockup { display: inline-flex; align-items: center; gap: 9px; }
        .tile { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
            background: linear-gradient(145deg, color-mix(in oklab, #685DBC 86%, white) 0%, #685DBC 55%, color-mix(in oklab, #685DBC 84%, black) 100%);
            box-shadow: 0 1px 2px rgba(19,17,30,.12), inset 0 1px 0 rgba(255,255,255,.18); }
        .knob { transform-box: fill-box; transform-origin: center; transition: transform .45s cubic-bezier(.34,1.4,.64,1); }
        .lockup:hover .knob { transform: translateY(4px); }
        .name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
        .name span { color: var(--brand); }
        .school { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); padding-left: 12px; border-left: 1px solid var(--line); min-width: 0; }
        .school span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .spacer { flex: 1; }
        .theme { display: flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
        .theme button { border: 0; background: transparent; color: var(--subtle); padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .theme button.on { background: var(--card); color: var(--brand); box-shadow: 0 1px 2px rgba(19,17,30,.08); }

        /* page */
        main { flex: 1; width: min(1080px, 100%); margin: 0 auto; padding: 36px 20px 28px; }
        .hello { font-size: 13px; font-weight: 700; color: var(--brand); }
        h1 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
        .lead { color: var(--subtle); margin-top: 6px; font-size: 14.5px; }

        .sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 26px; }
        .side { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; position: relative;
            transition: border-color .15s, box-shadow .15s, transform .15s; }
        .side:hover { border-color: var(--line-2); box-shadow: 0 12px 28px -10px rgba(19,17,30,.18); transform: translateY(-2px); }
        .side-head { display: flex; align-items: flex-start; gap: 14px; }
        .ic { width: 46px; height: 46px; border-radius: 13px; background: var(--mist); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ic svg, .go svg, .next svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .ic svg { width: 23px; height: 23px; }
        .side h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
        .side .desc { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-top: 2px; }
        .last { position: absolute; top: 18px; right: 18px; font-size: 11px; font-weight: 700; color: var(--brand-strong); background: var(--mist); border-radius: 999px; padding: 3px 9px; }

        .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .stat { background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
        .stat .k { font-size: 11.5px; font-weight: 700; color: var(--subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat .v { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .stat .v small { font-size: 13px; color: var(--subtle); font-weight: 700; }
        .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
        .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 999px; }

        .next { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); background: var(--sunken); border-radius: 12px; padding: 11px 12px; border: 1px dashed var(--line-2); }
        .next svg { width: 16px; height: 16px; color: var(--gold); margin-top: 1px; flex-shrink: 0; }
        .next b { color: var(--ink); }
        .next.ok svg { color: var(--ok); }

        .go { margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--brand); color: #fff; font-weight: 700; font-size: 14px; padding: 11px 16px; border-radius: 11px; }
        .go svg { width: 17px; height: 17px; transition: transform .15s; }
        .side:hover .go svg { transform: translateX(3px); }
        .side:hover .go { filter: brightness(1.06); }
        body.dark .go { color: #0F0E17; }

        .empty { font-size: 13px; color: var(--subtle); background: var(--sunken); border-radius: 12px; padding: 14px; border: 1px dashed var(--line-2); }

        footer { padding: 16px; text-align: center; font-size: 12px; color: var(--subtle); }
        footer b { color: var(--ink); font-weight: 800; }
        @media (max-width: 760px) {
            .sides { grid-template-columns: minmax(0, 1fr); }
            .school { display: none; }
            main { padding: 24px 16px; }
        }
        @media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats .stat:last-child { grid-column: span 2; } }
    </style>
</head>
<body>
    <header class="top">
        <a class="lockup" href="./" aria-label="revU home">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 52 52" width="18" height="18"><path d="M 16 9 L 16 30 A 10 10 0 0 0 36 30 L 36 22" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/><circle class="knob" cx="36" cy="12.5" r="4.5" fill="#D4920E"/></svg></span>
            <span class="name">rev<span>U</span></span>
        </a>
        <span class="school" id="school"></span>
        <span class="spacer"></span>
        <div class="theme" role="group" aria-label="Theme">
            <button type="button" data-theme="light">Light</button>
            <button type="button" data-theme="dark">Dark</button>
        </div>
    </header>

    <main>
        <div class="hello" id="hello">Welcome</div>
        <h1>What would you like to review?</h1>
        <p class="lead" id="lead">Pick a side - you can switch any time from the top bar.</p>

        <div class="sides">
            <a class="side" href="staff/" data-side="staff" id="card-staff">
                <div class="side-head">
                    <span class="ic"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></span>
                    <div><h2>Staff</h2><p class="desc">Appraisals, classroom observations and growth plans.</p></div>
                </div>
                <div id="staff-body"></div>
                <span class="go">Review staff <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
            </a>
            <a class="side" href="students/" data-side="students" id="card-students">
                <div class="side-head">
                    <span class="ic"><svg viewBox="0 0 24 24"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></span>
                    <div><h2>Students</h2><p class="desc">Exams, marks, growth and progress reports.</p></div>
                </div>
                <div id="students-body"></div>
                <span class="go">Review students <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
            </a>
        </div>
    </main>
    <footer>by <b>bhusku</b> &middot; Heavy on craft. Full of energy.</footer>

    <!-- The Students card reuses the student app's own calculations, so numbers match inside the app -->
    <script src="students/js/frameworks.js"></script>
    <script src="students/js/store.js"></script>
    <script>
    (function () {
        "use strict";
        const $ = (s) => document.querySelector(s);
        const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
        const store = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
        };
        const ALERT = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        const CHECK = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        const stat = (k, v, of, showBar) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}${of != null ? `<small>/${of}</small>` : ""}</div>${showBar ? `<div class="bar"><span style="width:${of ? pct(Number(String(v).replace("%", "")), of) : Number(String(v).replace("%", ""))}%"></span></div>` : ""}</div>`;
        const next = (html, ok) => `<div class="next ${ok ? "ok" : ""}">${ok ? CHECK : ALERT}<span>${html}</span></div>`;

        // ---- theme (shared with both apps) ----
        function applyTheme(t) {
            document.body.classList.toggle("dark", t === "dark");
            document.querySelectorAll(".theme button").forEach((b) => b.classList.toggle("on", b.dataset.theme === (t === "dark" ? "dark" : "light")));
        }
        applyTheme(store.get("revu_theme"));
        document.querySelectorAll(".theme button").forEach((b) => b.addEventListener("click", () => { store.set("revu_theme", b.dataset.theme); applyTheme(b.dataset.theme); }));

        // ---- greeting ----
        const h = new Date().getHours();
        $("#hello").textContent = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";

        // ---- remember the last side ----
        const last = store.get("revu_last_side");
        if (last) { const card = $(`[data-side="${last}"]`); if (card) card.insertAdjacentHTML("afterbegin", '<span class="last">Last opened</span>'); }
        document.querySelectorAll("[data-side]").forEach((a) => a.addEventListener("click", () => store.set("revu_last_side", a.dataset.side)));

        // ---- Staff card: read the staff app's saved data ----
        function renderStaff() {
            let db = null;
            try { db = JSON.parse(store.get("revu_database_v4") || "null"); } catch (e) { db = null; }
            const body = $("#staff-body");
            if (!db || !Array.isArray(db.users) || !Array.isArray(db.assessments)) {
                body.innerHTML = `<div class="empty">No staff reviews yet. Open <b>Staff</b> to set up your team and start an appraisal cycle.</div>`;
                return null;
            }
            const sessionId = db.activeSessionId || (db.sessions && db.sessions.length ? db.sessions[db.sessions.length - 1].id : null);
            const session = (db.sessions || []).find((s) => s.id === sessionId);
            const inCycle = db.assessments.filter((a) => !sessionId || a.session_id === sessionId);
            const inReview = new Set(inCycle.map((a) => a.subject_id)).size;
            const cat = {}; (db.templates || []).forEach((t) => { cat[t.id] = t.category || ""; });
            const done = inCycle.filter((a) => a.status === "signed_off" || a.status === "evaluator_completed");
            const awaiting = inCycle.filter((a) => a.status === "submitted").length;
            const drafts = inCycle.filter((a) => a.status === "draft" || a.status === "in_progress" || a.status === "not_started" || a.status === "pending").length;
            const observations = inCycle.filter((a) => String(cat[a.template_id]).startsWith("academic")).length;
            // Same rule as the staff app's dashboard: signed-off appraisals with a score
            const scored = inCycle.filter((a) => a.status === "signed_off" && a.score);
            const avg = scored.length ? Number((scored.reduce((s, a) => s + parseFloat(a.score), 0) / scored.length).toFixed(1)) : null;

            body.innerHTML = `<div class="stats">
                    ${stat("In review", inReview)}
                    ${stat("Appraisals done", done.length, inCycle.length, true)}
                    ${stat("Average score", avg == null ? "-" : (avg / 20).toFixed(2), avg == null ? null : 5)}
                </div>
                <div style="margin-top:12px">${awaiting || drafts
                    ? next(`<b>${awaiting}</b> awaiting sign-off and <b>${drafts}</b> in draft${session ? ` for session ${esc(session.name)}` : ""}. ${observations} classroom observations recorded.`)
                    : next(`Every appraisal${session ? ` for ${esc(session.name)}` : ""} is signed off.`, true)}</div>`;
            return db.tenant && db.tenant.name;
        }

        // ---- Students card: the student app's own pipeline ----
        function renderStudents() {
            const body = $("#students-body");
            if (!window.Store) { body.innerHTML = `<div class="empty">Open <b>Students</b> to get started.</div>`; return null; }
            Store.load();
            const db = Store.db;
            const inst = db.institution;
            const exam = Store.examById(inst.activeExam) || HPC_FW.EXAMS[0];
            const term = inst.activeTerm;
            const tally = { papers: [0, 0], marks: [0, 0], published: [0, 0], teacher: [0, 0] };
            db.classes.forEach((c) => {
                const p = Store.pipeline(c.id, exam.id, term);
                Object.keys(tally).forEach((k) => { tally[k][0] += p[k].done; tally[k][1] += p[k].total; });
            });
            const steps = [
                ["papers", "papers ready", "Papers"], ["marks", "marks entered", "Marks"],
                ["teacher", "students rated", "Growth"], ["published", "reports sent", "Reports"]
            ];
            const firstGap = steps.find(([k]) => tally[k][0] < tally[k][1]);
            body.innerHTML = `<div class="stats">
                    ${stat("Students", db.students.length)}
                    ${stat("Marks entered", `${pct(tally.marks[0], tally.marks[1])}%`, null, true)}
                    ${stat("Reports sent", tally.published[0], tally.published[1], true)}
                </div>
                <div style="margin-top:12px">${firstGap
                    ? next(`Next: <b>${esc(firstGap[2])}</b> - ${tally[firstGap[0]][0]} of ${tally[firstGap[0]][1]} ${esc(firstGap[1])} for ${esc(exam.name)}, ${esc(term)}.`)
                    : next(`Everything for ${esc(exam.name)}, ${esc(term)} is done - reports are out.`, true)}</div>`;
            return inst.name;
        }

        let staffSchool = null, studentSchool = null;
        try { staffSchool = renderStaff(); } catch (e) { console.error(e); $("#staff-body").innerHTML = `<div class="empty">Couldn't read staff data. Open <b>Staff</b> to continue.</div>`; }
        try { studentSchool = renderStudents(); } catch (e) { console.error(e); $("#students-body").innerHTML = `<div class="empty">Couldn't read student data. Open <b>Students</b> to continue.</div>`; }
        const school = studentSchool || staffSchool;
        if (school) $("#school").innerHTML = `<span>${esc(school)}</span>`;
    })();
    </script>
</body>
</html>
