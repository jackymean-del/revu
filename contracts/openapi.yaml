          format: uuid
        familyId:
          type: string
          format: uuid
        name:
          type: string
        board:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published, retired]
        packKey:
          type: string
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
