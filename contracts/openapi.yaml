        levelId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
    SchemeAssignmentInput:
      type: object
      additionalProperties: false
      required: [familyId]
      properties:
        familyId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
    SchemeAssignmentChange:
      type: object
      required: [assignment, marked]
      properties:
