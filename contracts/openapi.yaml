      summary: Work out a section's results under this version and under the scheme in force, and show the difference. Nothing is saved.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DryRunInput"
      responses:
        "200":
          description: The difference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DryRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/scheme-packs:
    get:
      operationId: listSchemePacks
      summary: The board packs revU ships, and whether each was imported here.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The packs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemePack"
        default:
          $ref: "#/components/responses/Problem"
  /v1/scheme-packs/{key}/import:
    post:
      operationId: importSchemePack
      summary: Make a draft scheme from a board pack. Importing it again returns the scheme made the first time.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The scheme.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemeImport"
        default:
          $ref: "#/components/responses/Problem"
  /v1/scheme-assignments:
    get:
      operationId: listSchemeAssignments
      summary: Where each scheme applies.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemeAssignment"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: assignScheme
      summary: Apply a scheme to a level, period and subject, each optional. It replaces the scheme already assigned there and marks the results it reaches stale.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemeAssignmentInput"
      responses:
        "200":
          description: Assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemeAssignmentChange"
        default:
          $ref: "#/components/responses/Problem"
  /v1/scheme-assignments/{id}:
    delete:
      operationId: unassignScheme
      summary: Stop applying a scheme there. The results it reaches are worked out again under whatever applies next.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/results:
    get:
      operationId: sectionResults
      summary: A section's results in one subject and period, with each component. Roles that see counts only get the counts.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: sectionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResults"
        default:
          $ref: "#/components/responses/Problem"
  /v1/results/explain:
    get:
      operationId: explainResult
      summary: How one result was worked out, input by input, with the scheme version and the rounding applied.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: studentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultExplanation"
        default:
          $ref: "#/components/responses/Problem"
  /v1/results/recompute:
    post:
      operationId: recomputeResults
      summary: Work out a section's results again now, for one subject or every subject.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecomputeInput"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecomputeDone"
        default:
          $ref: "#/components/responses/Problem"
  /v1/report-template:
    get:
      operationId: getReportTemplate
      summary: The institution's report template, or the default when none was saved.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putReportTemplate
      summary: Save the report template. Each save is a new version; reports already made keep theirs.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportTemplateInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        default:
          $ref: "#/components/responses/Problem"
  /v1/branding:
    get:
      operationId: getBranding
      summary: The institution's details as documents show them, at the latest version.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The branding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putBranding
      summary: Save the institution's details as a new branding version, keeping the logo.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/branding/logo:
    get:
      operationId: getBrandingLogo
      summary: The logo of the latest branding version.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putBrandingLogo
      summary: Replace the logo (PNG or JPEG, at most 256 KB) as a new branding version.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  x-go-type: string
                  description: A PNG or JPEG image of at most 256 KB.
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBrandingLogo
      summary: Remove the logo, as a new branding version.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/reports/status:
    get:
      operationId: reportStatus
      summary: A section's students and how ready their results are for reports.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: sectionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/reports/html:
    get:
      operationId: reportHtml
      summary: A preview of one student's report, or the whole section's, as the HTML the PDF is made from. It also prints from the browser.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: sectionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /v1/reports/pdf:
    post:
      operationId: reportPdf
      summary: Make the reports of a section, or of some of its students, as one PDF. Results are worked out afresh first, and each report's facts are stored so it can be shown again exactly.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPdfInput"
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /v1/marksheets.xlsx:
    get:
      operationId: marksheet
      summary: A section's marksheet for a period, in the report template's subject order, with a summary of class averages.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: sectionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The spreadsheet.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /v1/report-items/{id}/html:
    get:
      operationId: reportItemHtml
      summary: One report exactly as it was made, for its QR code.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The signed-in session token (shared bhusku sign-in).
  parameters:
    IncludeRemoved:
      name: includeRemoved
      in: query
      description: Also list removed items, so they can be restored.
      schema:
        type: boolean
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: X-Org-Id
      in: header
      required: true
      description: >
        The organisation to act in. It is a request, not proof: the server
        checks the person's membership there and answers 404 when there is none.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Something went wrong. The body says what, with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Branch:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 300
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    BranchInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 300
    Year:
      type: object
      required: [id, label, startsOn, endsOn]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: For example 2026-27.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    YearInput:
      type: object
      additionalProperties: false
      required: [label, startsOn, endsOn]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: For example 2026-27.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    Period:
      type: object
      required: [id, yearId, name, seq, startsOn, endsOn]
      properties:
        id:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 1
          description: Order within the year.
        kind:
          type: string
          maxLength: 40
          description: For example term or semester. Defaults to term.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    PeriodInput:
      type: object
      additionalProperties: false
      required: [yearId, name, seq, startsOn, endsOn]
      properties:
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 1
          description: Order within the year.
        kind:
          type: string
          maxLength: 40
          description: For example term or semester. Defaults to term.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    Level:
      type: object
      required: [id, name, seq]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 0
          description: Order, lowest first.
        stage:
          type: string
          maxLength: 60
          description: Optional band such as foundational or secondary.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    LevelInput:
      type: object
      additionalProperties: false
      required: [name, seq]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 0
          description: Order, lowest first.
        stage:
          type: string
          maxLength: 60
          description: Optional band such as foundational or secondary.
    Section:
      type: object
      required: [id, branchId, levelId, yearId, name]
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    SectionInput:
      type: object
      additionalProperties: false
      required: [branchId, levelId, yearId, name]
      properties:
        branchId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
    Subject:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          maxLength: 20
        kind:
          type: string
          enum: [academic, co_curricular]
          x-enum-varnames: [SubjectKindAcademic, SubjectKindCoCurricular]
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    SubjectInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          maxLength: 20
        kind:
          type: string
          enum: [academic, co_curricular]
          x-enum-varnames: [SubjectKindAcademic, SubjectKindCoCurricular]
    LevelSubject:
      type: object
      required: [id, levelId, subjectId, optional, applicability]
      properties:
        id:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        optional:
          type: boolean
          description: An elective, chosen by some students only.
        applicability:
          type: string
          enum: [all, selected]
          description: selected when the subject is optional or offered by a subject group, so only the students who chose it take it.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    LevelSubjectInput:
      type: object
      additionalProperties: false
      required: [levelId, subjectId, optional]
      properties:
        levelId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        optional:
          type: boolean
          description: An elective, chosen by some students only.
    TeachingAssignment:
      type: object
      required: [id, staffId, sectionId]
      properties:
        id:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          description: Absent means class teacher of the section.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    TeachingAssignmentInput:
      type: object
      additionalProperties: false
      required: [staffId, sectionId]
      properties:
        staffId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          description: Absent means class teacher of the section.
    Staff:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        employeeNo:
          type: string
          maxLength: 40
        designation:
          type: string
          maxLength: 80
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    StaffInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        employeeNo:
          type: string
          maxLength: 40
        designation:
          type: string
          maxLength: 80
    Guardian:
      type: object
      required: [id, studentId, name, isPrimary]
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        relation:
          type: string
          maxLength: 40
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 10
          description: Language for messages, for example en or hi.
        channel:
          type: string
          enum: [whatsapp, sms, email]
          x-enum-varnames: [ChannelWhatsapp, ChannelSms, ChannelEmail]
        isPrimary:
          type: boolean
          description: The first contact; at most one per student.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    GuardianInput:
      type: object
      additionalProperties: false
      required: [studentId, name, isPrimary]
      properties:
        studentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        relation:
          type: string
          maxLength: 40
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 10
          description: Language for messages, for example en or hi.
        channel:
          type: string
          enum: [whatsapp, sms, email]
          x-enum-varnames: [InputChannelWhatsapp, InputChannelSms, InputChannelEmail]
        isPrimary:
          type: boolean
          description: The first contact; at most one per student.
    Enrolment:
      type: object
      required: [id, studentId, sectionId]
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        rollNo:
          type: string
          maxLength: 20
        yearId:
          type: string
          format: uuid
          description: The year of the section, set by the server.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    EnrolmentInput:
      type: object
      additionalProperties: false
      required: [studentId, sectionId]
      properties:
        studentId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        rollNo:
          type: string
          maxLength: 20
    Student:
      type: object
      required: [id, admissionNo, name, status]
      properties:
        id:
          type: string
          format: uuid
        admissionNo:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 120
        preferredName:
          type: string
          maxLength: 80
        dob:
          type: string
          format: date
        status:
          type: string
          enum: [active, left, graduated]
          x-enum-varnames: [StudentActive, StudentLeft, StudentGraduated]
        placement:
          $ref: "#/components/schemas/Placement"
          x-go-type-skip-optional-pointer: false
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    StudentInput:
      type: object
      additionalProperties: false
      required: [admissionNo, name]
      properties:
        admissionNo:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 120
        preferredName:
          type: string
          maxLength: 80
        dob:
          type: string
          format: date
        status:
          type: string
          enum: [active, left, graduated]
