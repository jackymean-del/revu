        name:
          type: string
        board:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published, retired]
        packKey:
          type: string
          description: The board pack it was imported from, as board-stage@version.
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Scheme:
