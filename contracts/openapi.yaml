        default:
          $ref: "#/components/responses/Problem"
  /v1/branches:
    get:
      operationId: listBranchs
      summary: Every campus or branch site, in order. Removed ones only when asked for.
      tags: [structure]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IncludeRemoved"
      responses:
