        kind:
          type: string
          enum: [upload, paste, blanks_not_applicable, component_absent]
        cells:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/BulkCell"
        reason:
          type: string
    BulkResult:
      type: object
      required: [id, applied, refused]
      properties:
        id:
          type: string
          format: uuid
        applied:
          type: integer
        refused:
          type: array
          items:
            $ref: "#/components/schemas/BulkRefusal"
    BulkRefusal:
      type: object
      required: [studentId, partId, message]
      properties:
        studentId:
          type: string
        partId:
          type: string
        message:
          type: string
    BulkWrite:
      type: object
      required: [id, kind, cells, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        cells:
          type: integer
        createdAt:
          type: string
          format: date-time
        undoneAt:
          type: string
          format: date-time
    UndoResult:
      type: object
      required: [restored, kept]
      properties:
        restored:
          type: integer
        kept:
          type: integer
          description: Cells changed after the bulk write, left as they are.
    TableText:
      type: object
      required: [header, rows]
      properties:
        header:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
    LayoutItem:
      type: object
      additionalProperties: false
      required: [itemId, position, visible, pinned]
      properties:
        itemId:
          type: string
        position:
          type: integer
        visible:
          type: boolean
        pinned:
          type: boolean
    SortRule:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field:
          type: string
          enum: [roll_no, admission_no, name]
        direction:
          type: string
          enum: [asc, desc]
    Layout:
      type: object
      required: [surface, scopeId, items, sort, personal]
      properties:
        surface:
          type: string
        scopeId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/SortRule"
        personal:
          type: boolean
          description: true when this is the person's own saved view.
    LayoutInput:
      type: object
      additionalProperties: false
      required: [surface, scopeId, items, sort]
      properties:
        surface:
          type: string
          enum: [entry_grid]
        scopeId:
          type: string
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/LayoutItem"
        sort:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SortRule"
    Me:
      type: object
      required: [userId, orgs]
      properties:
        userId:
          type: string
          description: The sign-in id (Clerk user id).
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/MyOrg"
    MyOrg:
      type: object
      required: [id, name, preset, roles, setupDone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        preset:
          $ref: "#/components/schemas/Preset"
        staffId:
          type: string
          format: uuid
          description: This person's staff record here, when one is linked.
        setupDone:
          type: boolean
        roles:
          type: array
          items:
            type: string
            enum: [admin, principal, coordinator, teacher, class_teacher, viewer]
    Preset:
      type: string
      enum: [school, college, university]
      x-enum-varnames: [PresetSchool, PresetCollege, PresetUniversity]
    Terminology:
      type: object
      required: [preset, overrides]
      properties:
        preset:
          $ref: "#/components/schemas/Preset"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/TermOverride"
    TermOverride:
      type: object
      required: [key, one, other]
      properties:
        key:
          type: string
          description: A key from the terminology list, for example group.section.
        branchId:
          type: string
          format: uuid
          description: Limits the word to one branch. Absent means the whole organisation.
        one:
          type: string
          minLength: 1
          maxLength: 60
        other:
          type: string
          minLength: 1
          maxLength: 60
    Problem:
      type: object
      description: RFC 7807 problem details, plus revU's stable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI naming the problem kind, or about:blank.
        title:
          type: string
          description: A short, human summary. Do not branch on it.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What happened in this case, safe to show a person.
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable machine code, for example evidence.locked or validation.failed.
        requestId:
          type: string
          description: Quote this when reporting a problem; it finds the server log line.
        errors:
          type: array
          description: Per-field problems when code is validation.failed.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The request field, as a JSON pointer or a dotted name.
        code:
          type: string
          description: Stable code, for example required or too_long.
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok]
          x-enum-varnames: [HealthOk]
        database:
          type: boolean
          description: True when PostgreSQL answered a ping within 2 seconds.
        version:
          type: string
          description: The deployed build, or "dev" locally.
