components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The signed-in session token (shared bhusku sign-in).
  parameters:
    IncludeRemoved:
      name: includeRemoved
      in: query
      description: Also list removed items, so they can be restored.
      schema:
        type: boolean
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: X-Org-Id
      in: header
      required: true
      description: >
        The organisation to act in. It is a request, not proof: the server
        checks the person's membership there and answers 404 when there is none.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Something went wrong. The body says what, with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Branch:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 300
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    BranchInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 300
    Year:
      type: object
      required: [id, label, startsOn, endsOn]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: For example 2026-27.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    YearInput:
      type: object
      additionalProperties: false
      required: [label, startsOn, endsOn]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: For example 2026-27.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    Period:
      type: object
      required: [id, yearId, name, seq, startsOn, endsOn]
      properties:
        id:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 1
          description: Order within the year.
        kind:
          type: string
          maxLength: 40
          description: For example term or semester. Defaults to term.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    PeriodInput:
      type: object
      additionalProperties: false
      required: [yearId, name, seq, startsOn, endsOn]
      properties:
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 1
          description: Order within the year.
        kind:
          type: string
          maxLength: 40
          description: For example term or semester. Defaults to term.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    Level:
      type: object
      required: [id, name, seq]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 0
          description: Order, lowest first.
        stage:
          type: string
          maxLength: 60
          description: Optional band such as foundational or secondary.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    LevelInput:
      type: object
      additionalProperties: false
      required: [name, seq]
      properties:
        name:
          type: string
