openapi: 3.1.0
info:
  title: revU API
  version: 0.1.0
  description: >
    The revU server API. This file is the source of truth: change it first,
    then regenerate the TypeScript types (npm run gen:api in frontend/) and
    the Go types (make gen). Never hand-edit generated code.

    Errors: every non-2xx response is RFC 7807 problem details
    (application/problem+json) with a stable code, for example
    evidence.locked. Clients branch on code, never on title or detail.

    Base path: feature endpoints live under /v1. /api/health stays outside
    it so uptime checks never change.
servers:
  - url: https://api.revu.bhusku.com
  - url: http://localhost:8080
security:
  - session: []
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Who is signed in, and the organisations they belong to with their roles in each.
      tags: [identity]
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/webhooks/clerk:
    post:
      operationId: clerkWebhook
      summary: Clerk membership and user events, signed with Svix. Keeps memberships in step.
      description: >
        Accepted only with a valid svix-id, svix-timestamp and svix-signature.
        Used events: organizationMembership.created, .updated and .deleted,
        and user.deleted. Other events are acknowledged and ignored.
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: Applied, or not needed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/terminology:
    get:
      operationId: getTerminology
      summary: The organisation's preset and its own words, for t() in the app.
      tags: [terminology]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The preset and every override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terminology"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putTerminology
      summary: Replace the preset and every override. Administrators only.
      tags: [terminology]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Terminology"
      responses:
