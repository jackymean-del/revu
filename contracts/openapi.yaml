        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scheme"
        default:
          $ref: "#/components/responses/Problem"
