            application/json:
              schema:
                $ref: "#/components/schemas/Scheme"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateScheme
      summary: Change a draft. A published scheme never changes (scheme.immutable), so make a new version instead. A definition that breaks a rule is refused with one field error per line.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemeInput"
      responses:
        "200":
          description: Saved.
