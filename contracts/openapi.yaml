        orgs:
          type: array
          items:
            $ref: "#/components/schemas/MyOrg"
        platformOwner:
          type: boolean
          description: Whether this person runs the platform (a verified address in PLATFORM_OWNER_EMAILS).
        groups:
          type: array
          description: Groups this person administers.
          items:
            $ref: "#/components/schemas/GroupRef"
    MyOrg:
      type: object
      required: [id, name, preset, roles, setupDone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        preset:
          $ref: "#/components/schemas/Preset"
        staffId:
          type: string
          format: uuid
          description: This person's staff record here, when one is linked.
        setupDone:
          type: boolean
        roles:
          type: array
          items:
            type: string
            enum: [admin, principal, coordinator, teacher, class_teacher, viewer]
    Preset:
      type: string
      enum: [school, college, university]
      x-enum-varnames: [PresetSchool, PresetCollege, PresetUniversity]
    Terminology:
      type: object
      required: [preset, overrides]
      properties:
        preset:
          $ref: "#/components/schemas/Preset"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/TermOverride"
    TermOverride:
      type: object
      required: [key, one, other]
      properties:
        key:
          type: string
          description: A key from the terminology list, for example group.section.
        branchId:
          type: string
          format: uuid
          description: Limits the word to one branch. Absent means the whole organisation.
        one:
          type: string
          minLength: 1
          maxLength: 60
        other:
          type: string
          minLength: 1
          maxLength: 60
    Problem:
      type: object
      description: RFC 7807 problem details, plus revU's stable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI naming the problem kind, or about:blank.
        title:
          type: string
          description: A short, human summary. Do not branch on it.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What happened in this case, safe to show a person.
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable machine code, for example evidence.locked or validation.failed.
        requestId:
          type: string
          description: Quote this when reporting a problem; it finds the server log line.
        errors:
          type: array
          description: Per-field problems when code is validation.failed.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The request field, as a JSON pointer or a dotted name.
        code:
          type: string
          description: Stable code, for example required or too_long.
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok]
          x-enum-varnames: [HealthOk]
        database:
          type: boolean
          description: True when PostgreSQL answered a ping within 2 seconds.
        version:
          type: string
          description: The deployed build, or "dev" locally.
    SchemeDecimal:
      type: string
      pattern: '^\d{1,7}(\.\d{1,4})?$'
      description: An exact decimal, written as text so it is never a float.
    SchemeDefinition:
      type: object
      description: >
        A scheme as the engine reads it (blueprint Part 4.1). Components read
        the marks of assessments of some kinds; the subject expression
        combines them with the whitelisted functions only (sum, avg, min,
        max, best_n, scale, clamp, round_half_up, pct, coalesce).
      additionalProperties: false
      required: [schema, rounding, components, subject]
      properties:
        schema:
          type: integer
          enum: [1]
        rounding:
          $ref: "#/components/schemas/SchemeRounding"
        components:
          type: array
          items:
            $ref: "#/components/schemas/SchemeComponent"
        subject:
          $ref: "#/components/schemas/SchemeSubjectRule"
        grading:
          $ref: "#/components/schemas/SchemeGrading"
        pass:
          $ref: "#/components/schemas/SchemePass"
    SchemeRounding:
      type: object
      additionalProperties: false
      required: [mode, places, at]
      properties:
        mode:
          type: string
          enum: [half_up]
        places:
          type: integer
          minimum: 0
          maximum: 2
        at:
          type: string
          enum: [components, subject]
          description: components rounds each component before the subject is worked out, so the shown parts add up; subject rounds once at the end.
    SchemeComponent:
      type: object
      additionalProperties: false
      required: [code, name, from, aggregate, scale_to, on_absent]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,15}$'
        name:
          type: string
        from:
          $ref: "#/components/schemas/SchemeFrom"
        aggregate:
          $ref: "#/components/schemas/SchemeAggregate"
        scale_to:
          $ref: "#/components/schemas/SchemeDecimal"
        on_absent:
          type: string
          enum: [wait_makeup, zero, exclude, carry_forward]
    SchemeFrom:
      type: object
      additionalProperties: false
      required: [kinds, part_kind]
      properties:
        kinds:
          type: array
          items:
            type: string
            enum: [periodic_test, midterm, term_end]
        part_kind:
          type: string
          enum: [main, additional]
        component_code:
          type: string
          description: For additional columns, the code the column carries.
    SchemeAggregate:
      type: object
      additionalProperties: false
      required: [fn]
      properties:
        fn:
          type: string
          enum: [sum, avg, best_n, max, min]
        "n":
          type: integer
          minimum: 1
    SchemeSubjectRule:
      type: object
      additionalProperties: false
      required: [expr, max]
      properties:
        expr:
          type: string
        max:
          $ref: "#/components/schemas/SchemeDecimal"
    SchemeGrading:
      type: object
      additionalProperties: false
      required: [from, bands]
      properties:
        from:
          type: string
          enum: [rounded, unrounded]
        bands:
          type: array
          items:
            $ref: "#/components/schemas/SchemeBand"
    SchemeBand:
      type: object
      additionalProperties: false
      required: [label, min_pct]
      properties:
        label:
          type: string
        min_pct:
          $ref: "#/components/schemas/SchemeDecimal"
        descriptor:
          type: string
    SchemePass:
      type: object
      additionalProperties: false
      required: [subject_min_pct]
      properties:
