        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBranch
      summary: Add a campus or branch site.
      tags: [structure]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
