      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/subject-group-options/{id}/restore:
    post:
      operationId: restoreSubjectGroupOption
      summary: Bring back a removed subject a group offers.
      tags: [choices]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectGroupOption"
        default:
          $ref: "#/components/responses/Problem"
  /v1/subject-choices:
    get:
      operationId: listSubjectChoices
      summary: The choices in force on a day for the students of a section.
      tags: [choices]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: sectionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: "on"
          in: query
          description: The day to read choices on; today, kept inside the year, when left out.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectChoice"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: assignSubjectChoices
      summary: Give some students one option of a group. A group that allows one option replaces their earlier choice from the date given, keeping it in history.
      tags: [choices]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectChoiceInput"
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoiceResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/subject-choices/{id}:
    delete:
      operationId: endSubjectChoice
      summary: End a choice on a day, keeping it in history. A choice that had not started yet is withdrawn.
      tags: [choices]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
        - name: "on"
          in: query
          description: The day to read choices on; today, kept inside the year, when left out.
          schema:
            type: string
            format: date
      responses:
        "204":
          description: Ended.
        default:
          $ref: "#/components/responses/Problem"
  /v1/subject-choices/copy:
    post:
      operationId: copySubjectChoices
      summary: Give the students of a section the options they took last year, where a group of their new level offers the same subject.
      tags: [choices]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChoiceCopyInput"
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoiceResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/subject-choices/import:
    post:
      operationId: importSubjectChoices
      summary: Read admission numbers and subjects from a file. Shows what would change, and applies it only when asked.
      tags: [choices]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  x-go-type: string
                  description: .csv or .xlsx with an admission number column and one or more subject columns.
                apply:
                  type: string
                  enum: ["true", "false"]
                  description: true applies the rows that are in order; otherwise nothing is saved.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoiceImportReport"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sections/{id}/choice-completeness:
    get:
      operationId: getChoiceCompleteness
      summary: For each subject group of the section's level, who has chosen what and who still has to.
      tags: [choices]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
        - name: "on"
          in: query
          description: The day to read choices on; today, kept inside the year, when left out.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoiceCompleteness"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments:
    get:
      operationId: listAssessments
      summary: Assessments the person may see, newest first.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: sectionId
          in: query
          description: Only those covering this section.
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          description: Only those in this period.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAssessment
      summary: Add an assessment for some sections, with its entry columns.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}:
    put:
      operationId: updateAssessment
      summary: Change an assessment. A column holding marks cannot be removed, and a maximum cannot fall below a mark entered.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeAssessment
      summary: Remove an assessment that holds no marks yet.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}/lock:
    post:
      operationId: lockAssessment
      summary: Lock an assessment, so marks change after this only with a reason.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}/unlock:
    post:
      operationId: unlockAssessment
      summary: Open a locked assessment again, saying why.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          description: Open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}/grid:
    get:
      operationId: getMarksGrid
      summary: The entry grid for one section, with its students, columns, every cell with its state and version, and row status.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
        - name: sectionId
          in: query
          required: true
          description: The section.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The grid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarksGrid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}/participation/{studentId}:
    put:
      operationId: setParticipation
      summary: Set or clear a row status for one student. Marks under a status are hidden, never deleted.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipationInput"
      responses:
        "200":
          description: The row as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}/template.xlsx:
    get:
      operationId: downloadMarksTemplate
      summary: A spreadsheet pre-filled with admission numbers, names and the entry columns in the order asked for, to fill in any row order.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
        - name: sectionId
          in: query
          required: true
          description: The section.
          schema:
            type: string
            format: uuid
        - name: columns
          in: query
          description: Part ids in the order to show, comma separated; all, in paper order, when left out.
          schema:
            type: string
      responses:
        "200":
          description: The spreadsheet.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}/bulk:
    post:
      operationId: applyBulkWrite
      summary: Apply many cells as one undoable step (an upload, a paste, blanks marked not applicable, a component absent). Cells the person may not change are listed, not applied.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInput"
      responses:
        "200":
          description: What was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/assessments/{id}/bulk-writes:
    get:
      operationId: listBulkWrites
      summary: The bulk writes of one section, newest first.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
        - name: sectionId
          in: query
          required: true
          description: The section.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkWrite"
        default:
          $ref: "#/components/responses/Problem"
  /v1/bulk-writes/{id}/undo:
    post:
      operationId: undoBulkWrite
      summary: Undo a bulk write in one step. A cell changed since is kept as it is and counted.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: What was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sync/evidence:
    post:
      operationId: syncEvidence
      summary: Apply saved edits in order, each through the evidence rules. An edit whose cell moved on returns as a conflict with the current cell; a replayed op id returns its first answer.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncInput"
      responses:
        "200":
          description: One result per edit, in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tables/read:
    post:
      operationId: readTable
      summary: Read the first sheet of an uploaded .csv or .xlsx file as text, so the app can preview it. Nothing is stored.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  x-go-type: string
      responses:
        "200":
          description: The heading row and the rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableText"
        default:
          $ref: "#/components/responses/Problem"
  /v1/layouts/resolve:
    get:
      operationId: resolveLayout
      summary: The layout in force for the person on a surface and scope, their own view or the default.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: surface
          in: query
          required: true
          description: For now entry_grid.
          schema:
            type: string
        - name: scopeId
          in: query
          required: true
          description: For an entry grid, the assessment.
          schema:
            type: string
      responses:
        "200":
          description: The layout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        default:
          $ref: "#/components/responses/Problem"
  /v1/layouts/mine:
    put:
      operationId: saveMyLayout
      summary: Save the person's own view of a surface. It changes no calculation and nobody else's view.
      tags: [marks]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        default:
          $ref: "#/components/responses/Problem"
  /api/health:
    get:
      operationId: getHealth
      summary: Is the server up, and does its database answer?
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is up. The body says whether the database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The signed-in session token (shared bhusku sign-in).
  parameters:
    IncludeRemoved:
      name: includeRemoved
      in: query
      description: Also list removed items, so they can be restored.
      schema:
        type: boolean
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: X-Org-Id
      in: header
      required: true
      description: >
        The organisation to act in. It is a request, not proof: the server
        checks the person's membership there and answers 404 when there is none.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Something went wrong. The body says what, with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Branch:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 300
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    BranchInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 300
    Year:
      type: object
      required: [id, label, startsOn, endsOn]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: For example 2026-27.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    YearInput:
      type: object
      additionalProperties: false
      required: [label, startsOn, endsOn]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: For example 2026-27.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    Period:
      type: object
      required: [id, yearId, name, seq, startsOn, endsOn]
      properties:
        id:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 1
          description: Order within the year.
        kind:
          type: string
          maxLength: 40
          description: For example term or semester. Defaults to term.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    PeriodInput:
      type: object
      additionalProperties: false
      required: [yearId, name, seq, startsOn, endsOn]
      properties:
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 1
          description: Order within the year.
        kind:
          type: string
          maxLength: 40
          description: For example term or semester. Defaults to term.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    Level:
      type: object
      required: [id, name, seq]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 0
          description: Order, lowest first.
        stage:
          type: string
          maxLength: 60
          description: Optional band such as foundational or secondary.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    LevelInput:
      type: object
      additionalProperties: false
      required: [name, seq]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        seq:
          type: integer
          minimum: 0
          description: Order, lowest first.
        stage:
          type: string
          maxLength: 60
          description: Optional band such as foundational or secondary.
    Section:
      type: object
      required: [id, branchId, levelId, yearId, name]
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    SectionInput:
      type: object
      additionalProperties: false
      required: [branchId, levelId, yearId, name]
      properties:
        branchId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        yearId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
    Subject:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          maxLength: 20
        kind:
          type: string
          enum: [academic, co_curricular]
          x-enum-varnames: [SubjectKindAcademic, SubjectKindCoCurricular]
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    SubjectInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          maxLength: 20
        kind:
          type: string
          enum: [academic, co_curricular]
          x-enum-varnames: [SubjectKindAcademic, SubjectKindCoCurricular]
    LevelSubject:
      type: object
      required: [id, levelId, subjectId, optional, applicability]
      properties:
        id:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        optional:
          type: boolean
          description: An elective, chosen by some students only.
        applicability:
          type: string
          enum: [all, selected]
          description: selected when the subject is optional or offered by a subject group, so only the students who chose it take it.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    LevelSubjectInput:
      type: object
      additionalProperties: false
      required: [levelId, subjectId, optional]
      properties:
        levelId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        optional:
          type: boolean
          description: An elective, chosen by some students only.
    TeachingAssignment:
      type: object
      required: [id, staffId, sectionId]
      properties:
        id:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          description: Absent means class teacher of the section.
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    TeachingAssignmentInput:
      type: object
      additionalProperties: false
      required: [staffId, sectionId]
      properties:
        staffId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          description: Absent means class teacher of the section.
    Staff:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        employeeNo:
          type: string
          maxLength: 40
        designation:
          type: string
          maxLength: 80
        removedAt:
          type: string
          format: date-time
          description: Set when removed; absent while in use.
    StaffInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        employeeNo:
          type: string
          maxLength: 40
        designation:
          type: string
          maxLength: 80
    Guardian:
      type: object
      required: [id, studentId, name, isPrimary]
      properties:
        id:
