            enum: [deny, allow, own_subject, own_sections, own_section, section_remark, by_grant, by_grant_with_reason, counts_only, counts_reports_at_approval, by_policy, group_admin]
    OwnerOrg:
      type: object
      required: [id, name, type, preset, createdAt, admins, pendingAdmins, students, staff, demo]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [school, college, university]
        preset:
          type: string
        createdAt:
          type: string
          format: date-time
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        admins:
          type: integer
          description: People who hold the administrator role.
        pendingAdmins:
          type: array
          description: Addresses invited as administrator who have not signed in yet.
          items:
            type: string
        students:
          type: integer
        staff:
          type: integer
        demo:
          type: boolean
          description: A sample institution, not a client's.
    OwnerOrgInput:
      type: object
      additionalProperties: false
      required: [name, type, adminEmail]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [school, college, university]
        adminEmail:
          type: string
    OwnerOrgCreated:
      type: object
      required: [orgId, emailed]
      properties:
        orgId:
          type: string
          format: uuid
        emailed:
          type: boolean
          description: Whether the sign-in service emailed the invitation; they can sign in with the address either way.
    OwnerGroup:
      type: object
      required: [id, name, admins, orgIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        admins:
          type: array
          items:
            type: string
        orgIds:
          type: array
          items:
            type: string
            format: uuid
    GroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    GroupAdminInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    MyGroup:
      type: object
      required: [id, name, institutions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        institutions:
          type: array
          items:
            $ref: "#/components/schemas/GroupInstitution"
    GroupInstitution:
      type: object
      required: [id, name, type, member, students, sections, assessments, marksEntered]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        member:
          type: boolean
          description: Whether the person also belongs to it, and so can open it.
        students:
          type: integer
        sections:
          type: integer
          description: Classes running now, in the current academic period.
        assessments:
          type: integer
          description: Open for entry.
        marksEntered:
          type: integer
          description: Cells entered so far, of any state but pending.
    Me:
      type: object
      required: [userId, orgs, platformOwner, groups]
      properties:
        userId:
          type: string
          description: The sign-in id (Clerk user id).
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/MyOrg"
        platformOwner:
          type: boolean
          description: Whether this person runs the platform (a verified address in PLATFORM_OWNER_EMAILS).
        groups:
          type: array
          description: Groups this person administers.
          items:
            $ref: "#/components/schemas/GroupRef"
    MyOrg:
      type: object
      required: [id, name, preset, roles, setupDone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        preset:
          $ref: "#/components/schemas/Preset"
        staffId:
          type: string
          format: uuid
          description: This person's staff record here, when one is linked.
        setupDone:
          type: boolean
        roles:
          type: array
          items:
            type: string
            enum: [admin, principal, coordinator, teacher, class_teacher, viewer]
    Preset:
      type: string
      enum: [school, college, university]
      x-enum-varnames: [PresetSchool, PresetCollege, PresetUniversity]
    Terminology:
      type: object
      required: [preset, overrides]
      properties:
        preset:
          $ref: "#/components/schemas/Preset"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/TermOverride"
    TermOverride:
      type: object
      required: [key, one, other]
      properties:
        key:
          type: string
          description: A key from the terminology list, for example group.section.
        branchId:
          type: string
          format: uuid
          description: Limits the word to one branch. Absent means the whole organisation.
        one:
          type: string
          minLength: 1
          maxLength: 60
        other:
          type: string
          minLength: 1
          maxLength: 60
    Problem:
      type: object
      description: RFC 7807 problem details, plus revU's stable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI naming the problem kind, or about:blank.
        title:
          type: string
          description: A short, human summary. Do not branch on it.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What happened in this case, safe to show a person.
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable machine code, for example evidence.locked or validation.failed.
        requestId:
          type: string
          description: Quote this when reporting a problem; it finds the server log line.
        errors:
          type: array
          description: Per-field problems when code is validation.failed.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The request field, as a JSON pointer or a dotted name.
        code:
          type: string
          description: Stable code, for example required or too_long.
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok]
          x-enum-varnames: [HealthOk]
        database:
          type: boolean
          description: True when PostgreSQL answered a ping within 2 seconds.
        version:
          type: string
          description: The deployed build, or "dev" locally.
    SchemeDecimal:
      type: string
      pattern: '^\d{1,7}(\.\d{1,4})?$'
      description: An exact decimal, written as text so it is never a float.
    SchemeDefinition:
      type: object
      description: >
        A scheme as the engine reads it (blueprint Part 4.1). Components read
        the marks of assessments of some kinds; the subject expression
        combines them with the whitelisted functions only (sum, avg, min,
        max, best_n, scale, clamp, round_half_up, pct, coalesce).
      additionalProperties: false
      required: [schema, rounding, components, subject]
      properties:
        schema:
          type: integer
          enum: [1]
        rounding:
          $ref: "#/components/schemas/SchemeRounding"
        components:
          type: array
          items:
            $ref: "#/components/schemas/SchemeComponent"
        subject:
          $ref: "#/components/schemas/SchemeSubjectRule"
        grading:
          $ref: "#/components/schemas/SchemeGrading"
        pass:
          $ref: "#/components/schemas/SchemePass"
    SchemeRounding:
      type: object
      additionalProperties: false
      required: [mode, places, at]
      properties:
        mode:
          type: string
          enum: [half_up]
        places:
          type: integer
          minimum: 0
          maximum: 2
        at:
          type: string
          enum: [components, subject]
          description: components rounds each component before the subject is worked out, so the shown parts add up; subject rounds once at the end.
    SchemeComponent:
      type: object
      additionalProperties: false
      required: [code, name, from, aggregate, scale_to, on_absent]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,15}$'
        name:
          type: string
        from:
          $ref: "#/components/schemas/SchemeFrom"
        aggregate:
          $ref: "#/components/schemas/SchemeAggregate"
        scale_to:
          $ref: "#/components/schemas/SchemeDecimal"
        on_absent:
          type: string
          enum: [wait_makeup, zero, exclude, carry_forward]
    SchemeFrom:
      type: object
      additionalProperties: false
      required: [kinds, part_kind]
      properties:
        kinds:
          type: array
          items:
            type: string
            enum: [periodic_test, midterm, term_end]
        part_kind:
          type: string
          enum: [main, additional]
        component_code:
          type: string
          description: For additional columns, the code the column carries.
    SchemeAggregate:
      type: object
      additionalProperties: false
      required: [fn]
      properties:
        fn:
          type: string
          enum: [sum, avg, best_n, max, min]
        "n":
          type: integer
          minimum: 1
    SchemeSubjectRule:
      type: object
      additionalProperties: false
      required: [expr, max]
      properties:
        expr:
          type: string
        max:
          $ref: "#/components/schemas/SchemeDecimal"
    SchemeGrading:
      type: object
      additionalProperties: false
      required: [from, bands]
      properties:
        from:
          type: string
          enum: [rounded, unrounded]
        bands:
          type: array
          items:
            $ref: "#/components/schemas/SchemeBand"
    SchemeBand:
      type: object
      additionalProperties: false
      required: [label, min_pct]
      properties:
        label:
          type: string
        min_pct:
          $ref: "#/components/schemas/SchemeDecimal"
        descriptor:
          type: string
    SchemePass:
      type: object
      additionalProperties: false
      required: [subject_min_pct]
      properties:
        subject_min_pct:
          $ref: "#/components/schemas/SchemeDecimal"
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SchemeDecimal"
    SchemeSummary:
      type: object
      required: [id, familyId, name, version, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
          description: The id of version 1, shared by every version.
        name:
          type: string
        board:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published, retired]
        packKey:
          type: string
          description: The board pack it was imported from, as board-stage@version.
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Scheme:
      type: object
      required: [id, familyId, name, version, status, updatedAt, definition]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        name:
          type: string
        board:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published, retired]
        packKey:
          type: string
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        definition:
          $ref: "#/components/schemas/SchemeDefinition"
    SchemeInput:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        definition:
          $ref: "#/components/schemas/SchemeDefinition"
    SchemeChange:
      type: object
      required: [scheme, marked]
      properties:
        scheme:
          $ref: "#/components/schemas/Scheme"
        marked:
          type: integer
          description: How many results were marked to be worked out again.
    SchemeRef:
      type: object
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
    SchemePack:
      type: object
      required: [key, name, board, stage, version, description]
      properties:
        key:
          type: string
        name:
          type: string
        board:
          type: string
        stage:
          type: string
        version:
          type: integer
        description:
          type: string
        schemeId:
          type: string
          format: uuid
          description: Set when this pack was imported here already.
    SchemeImport:
      type: object
      required: [scheme, created]
      properties:
        scheme:
          $ref: "#/components/schemas/Scheme"
        created:
          type: boolean
          description: False when the pack had been imported before.
    SchemeAssignment:
      type: object
      required: [id, familyId, schemeName]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        schemeName:
          type: string
        publishedVersion:
          type: integer
          description: The version in force; absent while the scheme has no published version.
        levelId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
    SchemeAssignmentInput:
      type: object
      additionalProperties: false
      required: [familyId]
      properties:
        familyId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
    SchemeAssignmentChange:
      type: object
      required: [assignment, marked]
      properties:
        assignment:
          $ref: "#/components/schemas/SchemeAssignment"
        marked:
          type: integer
    DryRunInput:
      type: object
      additionalProperties: false
      required: [sectionId, periodId, subjectId]
      properties:
        sectionId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
    DryRun:
      type: object
      required: [students, changed, nowBlocked, rows]
      properties:
        current:
          $ref: "#/components/schemas/SchemeRef"
        students:
          type: integer
        changed:
          type: integer
        nowBlocked:
          type: integer
          description: Results that would become blocked.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DryRunRow"
    DryRunRow:
      type: object
      required: [studentId, name, changed]
      properties:
        studentId:
          type: string
          format: uuid
        name:
          type: string
        before:
          $ref: "#/components/schemas/ResultCell"
        after:
          $ref: "#/components/schemas/ResultCell"
        changed:
          type: boolean
        delta:
          type: string
          description: The change in percentage, when both have one.
    ResultCell:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [complete, provisional, blocked, not_assessed]
        reason:
          type: string
        value:
          type: string
        max:
          type: string
        pct:
          type: string
        grade:
          type: string
    ResultColumn:
      type: object
      required: [code, name, max]
      properties:
        code:
          type: string
        name:
          type: string
        max:
          type: string
    ResultCounts:
      type: object
      required: [complete, provisional, blocked, notAssessed, stale]
      properties:
        complete:
          type: integer
        provisional:
          type: integer
        blocked:
          type: integer
        notAssessed:
          type: integer
        stale:
          type: integer
    ComponentCell:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
        state:
          type: string
          enum: [complete, provisional, blocked, not_assessed]
        reason:
          type: string
        value:
          type: string
    StudentResult:
      type: object
      required: [studentId, name, admissionNo, stale, components]
      properties:
        studentId:
          type: string
          format: uuid
        name:
          type: string
        admissionNo:
          type: string
        rollNo:
          type: string
        stale:
          type: boolean
          description: Marks changed since this was worked out; a fresh result follows within seconds.
        result:
          $ref: "#/components/schemas/ResultCell"
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentCell"
    SectionResults:
      type: object
      required: [access, components, counts, rows]
      properties:
        access:
          type: string
          enum: [full, counts]
          description: counts means the person sees how many results are in each state, never a student's result.
        scheme:
          $ref: "#/components/schemas/SchemeRef"
        components:
          type: array
          items:
            $ref: "#/components/schemas/ResultColumn"
        counts:
          $ref: "#/components/schemas/ResultCounts"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/StudentResult"
    ResultExplanation:
      type: object
      required: [studentId, name, periodId, subjectId, scheme, stale, computedAt, detail]
      properties:
        studentId:
          type: string
          format: uuid
        name:
          type: string
        periodId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        scheme:
          $ref: "#/components/schemas/SchemeRef"
        stale:
          type: boolean
        computedAt:
          type: string
          format: date-time
        detail:
          $ref: "#/components/schemas/ResultDetail"
    ResultDetail:
      type: object
      description: Every input used, every policy decision and the arithmetic, as the engine recorded them.
      required: [state, expr, rounding, components]
      properties:
        state:
          type: string
          enum: [complete, provisional, blocked, not_assessed]
        reason:
          type: string
          description: Why a result is not complete, for example choice_missing, component_blocked:TE or pending:TE.
        value:
          type: string
        max:
          type: string
        pct:
          type: string
        grade:
          type: string
        gradeDescriptor:
          type: string
        passed:
          type: boolean
        basis:
          type: string
          enum: [full, renormalised, so_far]
          description: renormalised when a component was left out and the rest scaled up; so_far while a component is still to come.
        expr:
          type: string
        working:
          type: array
          items:
            type: string
        rounding:
          $ref: "#/components/schemas/SchemeRounding"
        components:
          type: array
          items:
            $ref: "#/components/schemas/ResultComponent"
    ResultComponent:
      type: object
      required: [code, name, aggregate, onAbsent, state, max, events]
      properties:
        code:
          type: string
        name:
          type: string
        aggregate:
          type: string
          description: sum, avg, max, min, or best_n:N.
        onAbsent:
          type: string
        state:
          type: string
          enum: [complete, provisional, blocked, left_out, not_assessed]
        reason:
          type: string
        value:
          type: string
        exact:
          type: string
          description: The value before rounding, when it differs.
        max:
          type: string
        pct:
          type: string
        working:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/ResultEvent"
    ResultEvent:
      type: object
      required: [assessmentId, title, kind, use, parts]
      properties:
        assessmentId:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
        heldOn:
          type: string
          format: date
        use:
          type: string
          enum: [used, dropped, carried, left_out, pending, blocked]
        reason:
          type: string
        carriedFrom:
          type: string
          format: uuid
        value:
          type: string
        max:
          type: string
        pct:
          type: string
        parts:
          type: array
          items:
            $ref: "#/components/schemas/ResultPart"
    ResultPart:
      type: object
      required: [partId, name, state, max, use]
      properties:
        partId:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        value:
          type: string
        max:
          type: string
        use:
          type: string
          enum: [counted, zero, left_out, pending, absent]
    RecomputeInput:
      type: object
      additionalProperties: false
      required: [sectionId, periodId]
      properties:
        sectionId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          description: One subject; absent means every subject the level teaches.
    RecomputeDone:
      type: object
      required: [computed]
      properties:
        computed:
          type: integer
          description: How many subject results were stored.
    ReportSection:
      type: object
      additionalProperties: false
      required: [key, "on"]
      properties:
        key:
          type: string
          enum: [identity, marks, components, overall, legend, signoff]
        "on":
          type: boolean
    ReportPaper:
      type: object
      additionalProperties: false
      required: [size, orientation]
      properties:
        size:
          type: string
          enum: [A4, Letter, A5, custom]
        widthMm:
          type: number
          description: For a custom size, 90 to 600.
        heightMm:
          type: number
          description: For a custom size, 90 to 600.
        orientation:
          type: string
          enum: [portrait, landscape]
    ReportConfig:
      type: object
      additionalProperties: false
      required: [title, sections, subjectOrder, signoff, paper, booklet, padEven, qr]
      properties:
        title:
          type: string
          maxLength: 80
        sections:
          type: array
          description: Every section once, in print order; the student's details always show.
          items:
            $ref: "#/components/schemas/ReportSection"
        subjectOrder:
          type: array
          description: Subject ids in print order; subjects not listed follow by name.
          items:
            type: string
            format: uuid
        signoff:
          type: array
          description: Sign-off lines, as terminology keys.
          items:
            type: string
            enum: [person.class_teacher, person.principal, person.guardian]
        paper:
          $ref: "#/components/schemas/ReportPaper"
        booklet:
          type: boolean
          description: Fold each report as a booklet, two pages to a side of the next sheet size up.
        padEven:
          type: boolean
          description: In a PDF of several reports, add a blank page after any report with an odd number of pages.
        qr:
          type: boolean
          description: Print a QR code that opens the stored report after sign-in; it carries no personal data.
    ReportTemplate:
      type: object
      required: [version, config]
      properties:
        id:
          type: string
          format: uuid
          description: Absent while the default has not been saved.
        version:
          type: integer
        config:
          $ref: "#/components/schemas/ReportConfig"
    ReportTemplateInput:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/ReportConfig"
    Branding:
      type: object
      required: [version, displayName, hasLogo]
      properties:
        version:
          type: integer
          description: 0 until the details are first saved.
        displayName:
          type: string
        address:
          type: string
        contact:
          type: string
        affiliation:
          type: string
        headerNote:
          type: string
        hasLogo:
          type: boolean
    BrandingInput:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        address:
          type: string
          maxLength: 300
        contact:
          type: string
          maxLength: 200
        affiliation:
          type: string
          maxLength: 200
        headerNote:
          type: string
          maxLength: 200
    ReportStudent:
      type: object
      required: [id, name, admissionNo]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        admissionNo:
          type: string
        rollNo:
          type: string
    ReportStatus:
      type: object
      required: [students, counts, pdf]
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/ReportStudent"
        counts:
          $ref: "#/components/schemas/ResultCounts"
        pdf:
          type: boolean
          description: Whether PDFs can be made here; when not, reports print from the browser.
    ReportPdfInput:
      type: object
      additionalProperties: false
      required: [sectionId, periodId]
      properties:
        sectionId:
          type: string
          format: uuid
        periodId:
          type: string
          format: uuid
