            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemeSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createScheme
      summary: Start a draft scheme from a definition.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemeInput"
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scheme"
