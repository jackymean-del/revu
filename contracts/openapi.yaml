openapi: 3.1.0
info:
  title: revU API
  version: 0.1.0
  description: >
    The revU server API. This file is the source of truth: change it first,
    then regenerate the TypeScript types (npm run gen:api in frontend/) and
    the Go types (make gen). Never hand-edit generated code.

    Errors: every non-2xx response is RFC 7807 problem details
    (application/problem+json) with a stable code, for example
    evidence.locked. Clients branch on code, never on title or detail.

    Base path: feature endpoints live under /v1. /api/health stays outside
    it so uptime checks never change.
servers:
  - url: https://api.revu.bhusku.com
  - url: http://localhost:8080
security:
  - session: []
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Who is signed in, and the organisations they belong to with their roles in each.
      tags: [identity]
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/webhooks/clerk:
    post:
      operationId: clerkWebhook
      summary: Clerk membership and user events, signed with Svix. Keeps memberships in step.
      description: >
        Accepted only with a valid svix-id, svix-timestamp and svix-signature.
        Used events: organizationMembership.created, .updated and .deleted,
        and user.deleted. Other events are acknowledged and ignored.
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: Applied, or not needed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/terminology:
    get:
      operationId: getTerminology
      summary: The organisation's preset and its own words, for t() in the app.
      tags: [terminology]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The preset and every override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terminology"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putTerminology
      summary: Replace the preset and every override. Administrators only.
      tags: [terminology]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Terminology"
      responses:
        "200":
          description: The terminology as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terminology"
        default:
          $ref: "#/components/responses/Problem"
  /api/health:
    get:
      operationId: getHealth
      summary: Is the server up, and does its database answer?
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is up. The body says whether the database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The signed-in session token (shared bhusku sign-in).
  parameters:
    OrgId:
      name: X-Org-Id
      in: header
      required: true
      description: >
        The organisation to act in. It is a request, not proof: the server
        checks the person's membership there and answers 404 when there is none.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Something went wrong. The body says what, with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Me:
      type: object
      required: [userId, orgs]
      properties:
        userId:
          type: string
          description: The sign-in id (Clerk user id).
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/MyOrg"
    MyOrg:
      type: object
      required: [id, name, preset, roles]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        preset:
          $ref: "#/components/schemas/Preset"
        roles:
          type: array
          items:
            type: string
            enum: [admin, principal, coordinator, teacher, class_teacher, viewer]
    Preset:
      type: string
      enum: [school, college, university]
      x-enum-varnames: [PresetSchool, PresetCollege, PresetUniversity]
    Terminology:
      type: object
      required: [preset, overrides]
      properties:
        preset:
          $ref: "#/components/schemas/Preset"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/TermOverride"
    TermOverride:
      type: object
      required: [key, one, other]
      properties:
        key:
          type: string
          description: A key from the terminology list, for example group.section.
        branchId:
          type: string
          format: uuid
          description: Limits the word to one branch. Absent means the whole organisation.
        one:
          type: string
          minLength: 1
          maxLength: 60
        other:
          type: string
          minLength: 1
          maxLength: 60
    Problem:
      type: object
      description: RFC 7807 problem details, plus revU's stable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI naming the problem kind, or about:blank.
        title:
          type: string
          description: A short, human summary. Do not branch on it.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What happened in this case, safe to show a person.
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable machine code, for example evidence.locked or validation.failed.
        requestId:
          type: string
          description: Quote this when reporting a problem; it finds the server log line.
        errors:
          type: array
          description: Per-field problems when code is validation.failed.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The request field, as a JSON pointer or a dotted name.
        code:
          type: string
          description: Stable code, for example required or too_long.
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok]
          x-enum-varnames: [HealthOk]
        database:
          type: boolean
          description: True when PostgreSQL answered a ping within 2 seconds.
        version:
          type: string
          description: The deployed build, or "dev" locally.
